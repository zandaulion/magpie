<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Magpie">
  <!-- The Scrap Collector:
       The magpie perches upon a sleek branch crossing through at a contrasting
       angle (+12°), visible on both sides of the bird to break any arrow silhouette.
       Its long iridescent tail feathers hang gracefully below the perch,
       and the corvid beak firmly holds a glowing golden thought scrap. -->
  <defs>
    <linearGradient id="sheen" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#24BFA6"/>
      <stop offset="48%" stop-color="#3A88E8"/>
      <stop offset="100%" stop-color="#8B52E8"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF1A8"/>
      <stop offset="45%" stop-color="#F3C853"/>
      <stop offset="100%" stop-color="#C58812"/>
    </linearGradient>
    <linearGradient id="branch-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#222834"/>
      <stop offset="40%" stop-color="#3C485C"/>
      <stop offset="100%" stop-color="#242B38"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="#14161A"/>
  <circle cx="256" cy="256" r="166" fill="#181C25" opacity="0.7"/>

  <!-- Stepped iridescent magpie tail (hanging gracefully at ~75°) -->
  <g fill="url(#sheen)">
    <!-- Central long feather -->
    <path d="M228 322 L196 468 C194 476 184 480 176 476 C170 472 168 464 170 456 L206 314 Z"/>
    <!-- Left outer feather -->
    <path d="M220 328 L174 454 C170 462 162 464 156 460 C150 454 150 446 154 440 L202 324 Z" opacity="0.8"/>
    <!-- Right inner feather -->
    <path d="M236 332 L216 458 C214 466 222 472 230 470 C236 466 238 458 236 450 L242 336 Z" opacity="0.65"/>
  </g>

  <!-- The Branch: crossing through at ~12°, visible on BOTH sides of the bird -->
  <path d="M64 366 C136 354 236 342 340 328 C404 320 444 314 464 310 C468 318 464 324 456 326 C436 330 396 336 336 344 C236 358 136 370 66 382 C60 376 60 370 64 366 Z" fill="url(#branch-grad)"/>

  <!-- Magpie Breast & Belly: Crisp White Flank Patch -->
  <path d="M238 334 C216 286 230 226 274 192 C306 168 348 166 378 182 C348 216 326 264 316 316 C290 338 260 342 238 334 Z" fill="#F2F4F6"/>

  <!-- Wing Covert (Iridescent sweep) -->
  <path d="M256 276 C282 228 342 206 390 230 C364 292 318 340 248 342 C244 318 248 294 256 276 Z" fill="url(#sheen)"/>

  <!-- Magpie Claws grasping the branch -->
  <path d="M276 340 C274 348 268 354 260 354 C256 354 254 350 256 344 C260 338 268 334 276 340 Z" fill="#101216"/>
  <path d="M294 336 C292 344 286 350 278 350 C274 350 272 346 274 340 C278 334 286 330 294 336 Z" fill="#101216"/>

  <!-- Head & Throat in profile -->
  <path d="M322 160 C356 128 414 138 432 178 C440 196 436 216 422 232 C408 224 392 208 380 188 C366 168 344 162 322 160 Z" fill="#242936" stroke="#353C4D" stroke-width="2"/>

  <!-- Authentic Corvid Beak holding scrap -->
  <path d="M418 172 L472 170 L428 194 Z" fill="#101216"/>
  <path d="M418 172 L472 170 L436 180 Z" fill="#363E50"/>

  <!-- The Golden Scrap -->
  <polygon points="456,138 504,156 484,202 436,184" fill="url(#gold)"/>
  <line x1="456" y1="138" x2="484" y2="202" stroke="#FFFFFF" stroke-width="1.8" opacity="0.6"/>

  <!-- Eye -->
  <circle cx="394" cy="174" r="5.5" fill="#F2F4F6"/>
  <circle cx="395" cy="173" r="2.2" fill="#101216"/>
</svg>
