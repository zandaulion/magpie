<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Magpie">
  <!-- The Scrap Collector:
       Revisiting the original premise with bold, scalable vectors.
       Real Eurasian Magpies have sharp black beaks; the gold accent belongs
       to the shiny scrap of thought clamped in its bill. The tail is stepped
       into graduated wedge feathers to remove the spoon/tool handle silhouette,
       and the dark corvid head has contour separation against the ground. -->
  <defs>
    <linearGradient id="sheen" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#24BFA6"/>
      <stop offset="48%" stop-color="#3A88E8"/>
      <stop offset="100%" stop-color="#8B52E8"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF1A8"/>
      <stop offset="45%" stop-color="#F3C853"/>
      <stop offset="100%" stop-color="#C58812"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="#14161A"/>
  <circle cx="260" cy="256" r="166" fill="#181C25" opacity="0.7"/>

  <!-- Stepped iridescent magpie tail (graduated wedge feathers) -->
  <path d="M124 456 L238 316 C242 322 244 330 240 338 L142 468 C136 476 126 470 124 456 Z" fill="url(#sheen)" opacity="0.8"/>
  <path d="M96 448 L232 284 C240 292 242 306 236 318 L114 460 C104 472 94 464 96 448 Z" fill="url(#sheen)"/>
  <path d="M152 464 L252 342 C256 348 256 356 250 362 L170 470 C162 478 154 474 152 464 Z" fill="url(#sheen)" opacity="0.65"/>

  <!-- White flank and scapular plumage -->
  <path d="M228 326 C206 278 220 220 262 188 C294 164 336 162 368 178 C338 212 316 260 306 312 C280 334 250 338 228 326 Z" fill="#F2F4F6"/>

  <!-- Iridescent wing covert -->
  <path d="M246 270 C272 222 332 200 380 224 C354 286 308 334 238 336 C234 312 238 288 246 270 Z" fill="url(#sheen)"/>

  <!-- Dark corvid head, nape and throat -->
  <path d="M312 154 C346 122 404 132 422 172 C430 190 426 210 412 226 C398 218 382 202 370 182 C356 162 334 156 312 154 Z" fill="#242936" stroke="#353C4D" stroke-width="2"/>

  <!-- Authentic Corvid Beak -->
  <path d="M408 166 L462 164 L418 188 Z" fill="#101216"/>
  <path d="M408 166 L462 164 L426 174 Z" fill="#363E50"/>

  <!-- The Golden Scrap: luminous thought fragment held in the bill -->
  <polygon points="446,132 494,150 474,196 426,178" fill="url(#gold)"/>
  <line x1="446" y1="132" x2="474" y2="196" stroke="#FFFFFF" stroke-width="1.8" opacity="0.6"/>

  <!-- Eye -->
  <circle cx="384" cy="168" r="5.5" fill="#F2F4F6"/>
  <circle cx="385" cy="167" r="2.2" fill="#101216"/>
</svg>
